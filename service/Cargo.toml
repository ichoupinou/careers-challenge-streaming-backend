[package]
name = "stream-service"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "stream_service"
path = "src/lib.rs"

[[bin]]
name = "stream-service"
path = "src/main.rs"

# Load generator (`make load`): only built with `--features loadgen`, so the
# service build doesn't pull in an HTTP client.
[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
required-features = ["loadgen"]

[features]
loadgen = ["dep:reqwest", "dep:fastrand"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream"], optional = true }
fastrand = { version = "2", optional = true }
axum = "0.8"
parking_lot = "0.12"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1
